services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
      POSTGRES_DB: admission
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=admission;Username=admission;Password=admission"
      HOLD_DURATION_SECONDS: "600"
    ports:
      - "8880:8880"
    depends_on:
      db:
        condition: service_healthy
  
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8880}
    ports:
      - "3000:80"
    depends_on:
      - backend
  
  tools:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: ["tools"]
    working_dir: /src/SchoolAdmission.Api
    volumes:
      - ./backend:/src
      - nuget-cache:/root/.nuget/packages

  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.tests
    profiles: ["tests"]
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=admission_test;Username=admission;Password=admission"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  nuget-cache: